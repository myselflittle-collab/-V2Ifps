name: Build apps

# Builds and tests the Windows installer/portable app and the Android APK.
# Publishing a GitHub Release (version taken from the VERSION file):
#   - push a commit to main whose message contains [release], or
#   - push a tag like v1.2.3, or
#   - Actions tab → Build apps → Run workflow with "publish" ticked.
on:
  push:
    tags: ["v*"]
    branches: ["main", "feature/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { (Get-Content VERSION -Raw).Trim() }
          "APP_VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build UI
        working-directory: frontend
        run: npm ci; npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r backend/requirements.txt -r desktop/requirements.txt

      - name: Download FFmpeg (BtbN win64 GPL shared build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n\d+\.\d+.*-win64-gpl-shared-\d+\.\d+\.zip$' } | Sort-Object name -Descending | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-gpl-shared.zip' } }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          $bin = Get-ChildItem ffmpeg_x -Recurse -Directory -Filter bin | Select-Object -First 1
          New-Item -ItemType Directory desktop/ffmpeg_bin | Out-Null
          Copy-Item "$($bin.FullName)\*" desktop/ffmpeg_bin/
          Copy-Item (Get-ChildItem ffmpeg_x -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName desktop/FFmpeg-LICENSE.txt
          & desktop/ffmpeg_bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Build FrameX.exe
        run: |
          pyinstaller desktop/framex.spec --noconfirm
          Copy-Item desktop/FFmpeg-LICENSE.txt dist/FrameX/
          Copy-Item LICENSE dist/FrameX/FrameX-LICENSE.txt

      - name: Self-test the packaged app
        run: |
          $p = Start-Process dist/FrameX/FrameX.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/FrameX/selftest.log"
          if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))" }

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=$env:APP_VERSION desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Install silently and self-test the installed app
        run: |
          $setup = Get-ChildItem dist_installer/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Remove-Item "$env:LOCALAPPDATA/FrameX/selftest.log" -ErrorAction SilentlyContinue
          $p = Start-Process "$env:LOCALAPPDATA/Programs/FrameX/FrameX.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/FrameX/selftest.log"
          if ($p.ExitCode -ne 0) { throw "Installed app self-test failed" }

      - name: Package portable zip
        run: Compress-Archive dist/FrameX/* "dist_installer/FrameX-Portable-$env:APP_VERSION-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FrameX-Windows
          path: dist_installer/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          v=$(tr -d '[:space:]' < VERSION); if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APKs and run unit tests
        run: gradle -p android --no-daemon testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the frame engine and the release APK on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest
            adb logcat -d -s FrameXTest:I | tail -5
            for f in $(adb shell ls /data/local/tmp/ | grep framex_ | tr -d '\r'); do echo "SCREENSHOT $f"; adb exec-out cat /data/local/tmp/$f | base64 -w0; echo; done
            android/ci/smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/FrameX-$APP_VERSION.apk" || true
          cp smoke-screenshot.png out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrameX-Android
          path: out/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/

  release:
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          v=$(tr -d '[:space:]' < VERSION); if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List files
        run: ls -laR dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FrameX ${{ env.TAG }}
          make_latest: true
          body: |
            **Windows:** download `FrameX-Setup-*.exe` and run it (no admin rights needed). Or use the portable zip: unzip and run `FrameX.exe`.
            FFmpeg is included. If Windows SmartScreen warns about an unrecognised app, click **More info → Run anyway** (the installer is not code-signed).

            **Android 10+:** download `FrameX-*.apk` on your phone and open it. Allow installing from your browser or Files app when asked.

            Both versions extract every decoded frame at the original resolution, name them 1..N, and save a verified ZIP.
          files: |
            dist/FrameX-Windows/*
            dist/FrameX-Android/*.apk
          fail_on_unmatched_files: true
